<!-- Needs editing, styling is also ugly. The style should be black and white with very little elements actually being the theme colour. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synapse – Dashboards</title>
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <script src="/colour/theme-loader.js"></script>
    <link rel="stylesheet" href="/colour/colour.css">
    <script src="/auth-utils.js"></script>
    <script src="/utils/domHelpers.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <div class="brand-title">Synapse</div>
          <div class="brand-subtitle">agentic pm</div>
        </div>

        <div class="topbar-center">
          <input
            type="search"
            placeholder="Search dashboards..."
            class="topbar-search"
          />
        </div>

        <div class="topbar-right">
          <button
            type="button"
            class="icon-button dark-mode-toggle"
            id="darkModeToggle-btn"
            aria-label="Toggle dark mode"
          >
            <svg id="theme-icon" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          
          <div class="notification-container">
            <button
              type="button"
              class="icon-button notification-bell"
              id="notificationBell"
              aria-label="View notifications"
            >
              <svg class="bell-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span class="notification-badge" id="notificationBadge" style="display: none;">1</span>
            </button>
            
            <div class="notification-popup" id="notificationPopup">
              <div class="notification-header">
                <h3>Notifications</h3>
                <button type="button" class="close-popup" id="closePopup" aria-label="Close">×</button>
              </div>
              <div class="notification-list" id="notificationList">
                <div class="notification-item">
                  <div class="notification-title">Welcome</div>
                  <div class="notification-message">Welcome to Synapse! Start creating dashboards.</div>
                  <div class="notification-time">Now</div>
                </div>
              </div>
            </div>
          </div>
          
          <a href="/settings/profile/profile.html" class="user-pill-link">
            <div class="user-pill">
              <span class="user-initials">as</span>
            </div>
          </a>
        </div>
      </header>

      <main class="main">
        <div class="dashboard-header">
          <div>
            <h1 class="page-title">Dashboards</h1>
            <p class="page-subtitle">Choose a workspace or create a new one.</p>
          </div>
          <button type="button" class="create-dashboard-btn" id="create-dashboard-card">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            New Dashboard
          </button>
        </div>

        <div class="dashboard-grid" id="dashboard-grid">
          <!-- Dashboard cards will be dynamically inserted here -->
        </div>
      </main>
      

    </div>

    <div class="overlay" id="new-dashboard-overlay" aria-hidden="true">
      <div class="overlay-backdrop" id="overlay-backdrop"></div>
      <div
        class="overlay-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="overlay-title"
      >
        <div class="overlay-header">
          <h2 id="overlay-title">Create new dashboard</h2>
          <button
            type="button"
            class="icon-button overlay-close"
            id="overlay-close"
            aria-label="Close"
          >
          </button>
        </div>
        <form id="new-dashboard-form" class="overlay-form">
          <label class="overlay-field">
            <span class="overlay-label">Dashboard name</span>
            <input type="text" id="dashboard-name" required />
          </label>

          <label class="overlay-field">
            <span class="overlay-label">Description (optional)</span>
            <textarea id="dashboard-description" rows="3"></textarea>
          </label>

          <div class="overlay-actions">
            <button
              type="button"
              class="overlay-button secondary"
              id="overlay-cancel"
            >
              Cancel
            </button>
            <button type="submit" class="overlay-button primary">Create</button>
          </div>
        </form>
      </div>
    </div>
  </body>
  <script src="/colour/colour.js"></script>
  <script src="/dashboard/dashboard.js"></script>
</html>
