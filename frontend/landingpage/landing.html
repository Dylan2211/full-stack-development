<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse - Landing Page</title>
    <script src="/colour/theme-loader.js"></script>
    <link rel="stylesheet" href="/colour/colour.css">
    <link rel="stylesheet" href="landing.css">
    <link rel="icon" type="image/png" href="../images/favicon.png" />
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="../images/favicon.png" alt="Synapse Logo" />
            </div>
        </header>
        
        <main>
            <div class="content">
                <h1>Synapse brings your projects, workflows, and updates together in one intelligent space.</h1>
                
                <p class="subtitle">Keep every task organised and visible - even when your team or agents aren't.</p>
                
                <button class="cta-button">Get Started</button>
            </div>
            
            <div class="illustration">
                <img src="../images/ai-agents/Landing page graphic.jpg" alt="Landing page illustration">
            </div>
        </main>
    </div>
    <script src="/colour/colour.js"></script>
    <script type="module" src="landing.js"></script>
</body>
</html>
