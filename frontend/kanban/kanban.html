<!-- I need a back button -->
 <!-- The styling has too much blue, looks better with black and white (simple) -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title><!--Title to be populated dynamically-->Loading...</title>
    <script src="/colour/theme-loader.js"></script>
        <link rel="stylesheet" href="/colour/colour.css">
    <link rel="stylesheet" href="/kanban/kanban.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <script src="/auth-utils.js"></script>
  </head>
  <body>
    <!-- Task Creation Notification -->
    <div id="taskNotification" class="task-notification">
      <div class="notification-content">
        <span class="notification-text">adding task...</span>
        <div class="notification-spinner"></div>
      </div>
    </div>

    <div class="page">
      <header class="board-header">
        <div class="board-left">
          <a class="back-button" href="/dashboard/dashboard.html" aria-label="Back to dashboards">
            <img src="../../images/favicon.png" alt="Back" />
          </a>
          <h1 id="dashboardTitle" class="board-title" aria-live="polite"></h1>
        </div>
        <div class="board-right">
          <a id="analyticsButton" class="analytics-button" aria-label="analytics">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v18h18"/>
              <path d="M18.7 8l-5.1 5.1-2.8-2.8L7 14.2"/>
            </svg>
          </a>
          <a id="settingsButton" class="settings-button" aria-label="settings">
            <img src="/images/Settings.png" alt="Settings" />
          </a>
          <button id="new-task-trigger" class="add-task-button">
            add task
          </button>
        </div>
      </header>

      <main class="board-shell">
        <div class="board-frame">
          <!-- Boards to be populated dynamically -->
        </div>
      </main>
    </div>
    <dialog id="newTaskDialog" class="task-dialog">
      <form id="taskForm" method="dialog" class="dialog-content">
        <button id="closeTask" class="close-btn" type="button">&times;</button>
        <h2>New Task</h2>

        <label>Task Title</label>
        <input type="text" id="taskTitle" required />

        <label>Description</label>
        <textarea id="taskDesc" rows="3"></textarea>

        <label>Board</label>
        <select id="taskBoard" required></select>

        <label>Skills (comma-separated, e.g. "JavaScript, React")</label>
        <input type="text" id="taskSkills" placeholder="Used by system to auto-assign agents" />

        <!-- NOTE: Assign Agent field is captured but backend ignores it. 
             Backend ALWAYS auto-assigns agents based on task skills. -->
        <label style="color: #666; font-size: 0.9em;">Assign Agent(s) (informational only)</label>
        <select id="taskAgents" multiple style="opacity: 0.7;"></select>

        <label>AI Model (Optional - for content generation)</label>
        <select id="taskAIModel">
          <option value="">None</option>
          <option value="auto">Auto (Smart Selection)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gpt-4o-mini">GPT-4o Mini</option>
          <option value="llama-3.1-8b-instant">Groq Llama 3.1 (8B) Instant</option>
          <option value="gemma3:4b">Ollama Gemma 3 (4B)</option>
        </select>
        <div id="agentModelNote" style="display:none; color:#666; font-size:0.9em; margin-top:6px;"></div>

        <div class="form-buttons">
          <button id="cancelTask" type="button">Cancel</button>
          <button id="createTask" type="submit">Create Task</button>
        </div>
      </form>
    </dialog>

    <dialog id="deleteConfirmDialog" class="confirm-dialog">
      <div class="confirm-content">
        <h3>Delete Board</h3>
        <p id="deleteConfirmText">Are you sure you want to delete this board?</p>
        <div class="confirm-buttons">
          <button id="deleteConfirmCancel" type="button">Cancel</button>
          <button id="deleteConfirmSubmit" type="button" class="danger">Delete</button>
        </div>
      </div>
    </dialog>
  </body>
  <script src="/colour/colour.js"></script>
  <script defer src="/kanban/kanban.js"></script>
</html>
