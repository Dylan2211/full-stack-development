<!DOCTYPE html>
<html>
  <head>
    <title>Your Activity</title>
    <script src="/colour/theme-loader.js"></script>
    <link rel="stylesheet" href="/colour/colour.css">
    <link rel="stylesheet" href="activity.css" />
    <link rel="icon" type="image/png" href="../../images/favicon.png" />
  </head>

  <body>
    <div class="sidebar">
      <div class="sidebar-header">
        <a href="../../dashboard/" class="back-btn">
          <img src="../../images/favicon.png" alt="Back" />
        </a>
        <h3>Settings</h3>
      </div>

      <a href="../profile/profile.html">Profile</a>
      <a href="../security/security.html">Security</a>
      <a class="active">Your Activity</a>
      
      <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16,17 21,12 16,7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    </div>

    <div class="page">
      <h2>Your Activity</h2>
      <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">
        View all actions you've taken across all dashboards
      </p>

      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">All Activity</button>
        <button class="tab-btn" data-filter="today">Today</button>
        <button class="tab-btn" data-filter="past_week">Past Week</button>
        <button class="tab-btn" data-filter="older">Older</button>
      </div>

      <div class="activity-container empty-state">
        <p>Loading activities...</p>
      </div>

      <div id="activity-list"></div>
    </div>
  </body>
  <script src="/auth-utils.js"></script>
  <script src="/colour/colour.js"></script>
  <script src="activity.js?v=2"></script>
</html>
