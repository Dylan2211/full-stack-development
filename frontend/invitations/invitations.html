<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse – Invitations</title>
    <link rel="stylesheet" href="/invitations/invitations.css">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <script src="/colour/theme-loader.js"></script>
    <link rel="stylesheet" href="/colour/colour.css">
    <script src="/auth-utils.js"></script>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <div class="brand">
                <div class="brand-title">Synapse</div>
                <div class="brand-subtitle">agentic pm</div>
            </div>

            <div class="topbar-center">
                <span class="page-breadcrumb">Invitations</span>
            </div>

            <div class="topbar-right">
                <button type="button" class="icon-button dark-mode-toggle" id="darkModeToggle-btn" aria-label="Toggle dark mode">
                    <svg id="theme-icon" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                
                <a href="/dashboard" class="icon-button" title="Back to Dashboards">
                    <svg class="bell-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"></path>
                    </svg>
                </a>
                
                <a href="/settings/profile/profile.html" class="user-pill-link">
                    <div class="user-pill">
                        <span class="user-initials">me</span>
                    </div>
                </a>
            </div>
        </header>

        <main class="main">
            <div class="invitations-header">
                <div>
                    <h1 class="page-title">Dashboard Invitations</h1>
                    <p class="page-subtitle">Accept or decline invitations to collaborate on dashboards.</p>
                </div>
            </div>

            <div class="invitations-list" id="invitationsList">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading your invitations...</p>
                </div>
            </div>
        </main>

        <div class="logout-container">
            <button type="button" class="logout-btn" id="logoutBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16,17 21,12 16,7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
        </div>
    </div>

    <script src="/colour/colour.js"></script>
    <script src="/invitations/invitations.js"></script>
</body>
</html>
